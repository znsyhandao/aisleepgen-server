global:
  scrape_interval: 30s  # 从15s调整为30s
  evaluation_interval: 30s
# 新增告警规则配置
rule_files:
  - '/etc/prometheus/rules/*.yml'

# 新增Alertmanager配置
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 'alertmanager:9093'
scrape_configs:
  - job_name: 'payment_service'
    scrape_interval: 30s
    static_configs:
      - targets: ['app:8000']

