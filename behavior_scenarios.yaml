  - name: aeo_optimize_normalize
    description: Optimize() should produce weights summing to 1.0
    imports:
      - "from weight_optimizer import get_weight_optimizer"
    setup: |
      import os, shutil
      from weight_optimizer import WEIGHT_DIR
      if os.path.exists(WEIGHT_DIR):
        shutil.rmtree(WEIGHT_DIR)
      import weight_optimizer as _wo
      _wo._optimizer_instance = None
      wo = get_weight_optimizer()
      for i in range(30):
        w = {'rl': 0.35, 'pomdp': 0.35, 'wm': 0.15, 'temporal': 0.15} if i % 2 == 0 else {'rl': 0.40, 'pomdp': 0.30, 'wm': 0.15, 'temporal': 0.15}
        wo.record_outcome(f'_ba_aeo_opt_{i}', w, 'push', 0.7 if i % 3 != 0 else 0.3)
    action: |
      report = wo.optimize()
      new_sum = sum(report['new_weights'].values())
      m = f"sum={new_sum:.4f}, report={report['new_weights']}"
    assert_expr: "abs(new_sum - 1.0) < 0.01"
    measurement_expr: "m"
    reason: Optimized weights must normalize to 1.0

  - name: aeo_optimize_change_limit
    description: Each weight change after optimize() must not exceed 0.02
    imports:
      - "from weight_optimizer import get_weight_optimizer"
    setup: |
      import os, shutil
      from weight_optimizer import WEIGHT_DIR
      if os.path.exists(WEIGHT_DIR):
        shutil.rmtree(WEIGHT_DIR)
      import weight_optimizer as _wo
      _wo._optimizer_instance = None
      wo = get_weight_optimizer()
      for i in range(30):
        w = {'rl': 0.35, 'pomdp': 0.35, 'wm': 0.15, 'temporal': 0.15}
        wo.record_outcome(f'_ba_aeo_cl_{i}', w, 'push', 0.5)
      report = wo.optimize()
    action: |
      max_change = max(abs(report['new_weights'][k] - report['old_weights'][k]) for k in ['rl', 'pomdp', 'wm', 'temporal'])
      m = f"max_change={max_change:.4f}"
    assert_expr: "max_change <= 0.025"
    measurement_expr: "m"
    reason: Weight changes must not exceed 0.02 per optimization

