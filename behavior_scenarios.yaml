  - name: narrative_has_data_user
    description: User with POMDP data + WM data -> complete story with 4 modules
    imports:
      - "from narrative_engine import get_narrative_engine"
    setup: |
      ne = get_narrative_engine()
      from pomdp_learner import get_engine; e = get_engine()
      e.observe('_ba_nar_behave', text='失眠', score=55)
      e.observe('_ba_nar_behave', text='醒了', score=50)
      from working_memory import get_working_memory; wm = get_working_memory()
      for i,s in enumerate([55,50,45]):
        wm.push('_ba_nar_behave', {'text':'d'+str(i),'score_obs':s,'emotion':'negative','intervention':'none','outcome':'none'})
    action: |
      r = ne.generate_story('_ba_nar_behave', {'mode':'analyze'})
      m = len(r['story'])
    assert_expr: "r['has_data'] and len(r['story']) > 80 and all(k in r['modules'] for k in ['what','why','whats_next','what_to_do'])"
