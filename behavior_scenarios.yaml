          'pomdp_choice': 'skip', 'pomdp_score': 0.68,
          'wm_choice': 'skip', 'wm_score': 0.55,
          'temporal_choice': 'skip', 'temporal_score': 0.50,
          'temporal_state': '持平震荡', 'winner': 'skip', 'final_score': 0.70,
        }
      }
