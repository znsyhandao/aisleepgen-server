  # ==================== Decision Explainer (v6.4.0) ====================

  - name: explain_down_trend_push
    description: Down trend + push decision -> explanation mentions worsening
    imports:
      - "from decision_explainer import get_decision_explainer"
    setup: |
      de = get_decision_explainer()
      from pomdp_learner import get_engine; e = get_engine()
      e.observe('_ba_exp_down', text='失眠', score=60)
      e.observe('_ba_exp_down', text='还是睡不着', score=45)
      from working_memory import get_working_memory; wm = get_working_memory()
      for i,s in enumerate([60,52,45]):
        wm.push('_ba_exp_down', {'text':'d'+str(i),'score_obs':s,'emotion':'negative','intervention':'none','outcome':'none'})
    action: |
      decision = {
        'action': 'push', 'reason': 'score_drop', 'confidence': 0.72,
        'decision_chain': {
          'rl_choice': 'push', 'rl_score': 0.65,
          'pomdp_choice': 'push', 'pomdp_score': 0.52,
          'wm_choice': 'push', 'wm_score': 0.30,
          'temporal_choice': 'push', 'temporal_score': 0.45,
          'temporal_state': '正在恶化', 'winner': 'push', 'final_score': 0.62,
        }
      }
      exp = de.explain('_ba_exp_down', decision)
      m = exp['evidence']
    assert_expr: "'恶化' in exp['evidence'] or '下降' in exp['trigger'] or '趋势' in exp['evidence']"
    measurement_expr: "m[:100]"
    reason: Downward trend+push must contain worsening semantics

  - name: explain_stable_skip
    description: Stable trend + skip decision -> explanation mentions observation
    imports:
