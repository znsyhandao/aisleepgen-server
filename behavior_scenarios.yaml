  # ==================== AEO 权重优化 (v6.1.0) ====================

  - name: aeo_default_weights
    description: Default base weights should be 35/35/15/15
    imports:
      - "from weight_optimizer import get_weight_optimizer"
    setup: |
      import os, shutil
      from weight_optimizer import WEIGHT_DIR
      if os.path.exists(WEIGHT_DIR):
        shutil.rmtree(WEIGHT_DIR)
      import weight_optimizer as _wo
      _wo._optimizer_instance = None
      wo = get_weight_optimizer()
    action: |
      base = wo._load_base_weights()
      m = f"rl={base['rl']:.2f}, pomdp={base['pomdp']:.2f}, wm={base['wm']:.2f}, temporal={base['temporal']:.2f}"
    assert_expr: "abs(base['rl'] - 0.35) < 0.001 and abs(base['pomdp'] - 0.35) < 0.001 and abs(base['wm'] - 0.15) < 0.001 and abs(base['temporal'] - 0.15) < 0.001"
    measurement_expr: "m"
    reason: Initial weights must be exactly 35/35/15/15

  - name: aeo_high_uncertainty_boost
    description: High uncertainty should increase temporal weight by ~5%
    imports:
      - "from weight_optimizer import get_weight_optimizer"
    setup: |
      import os, shutil
      from weight_optimizer import WEIGHT_DIR
      if os.path.exists(WEIGHT_DIR):
        shutil.rmtree(WEIGHT_DIR)
      import weight_optimizer as _wo
      _wo._optimizer_instance = None
      wo = get_weight_optimizer()
      # Patch count_observations to avoid new_user boost
      _wo.N_NEEDED_FOR_NEW_USER = 0
    action: |
      base = wo._load_base_weights()
      weights = wo.get_weights('_ba_aeo_see', {'high_uncertainty': True})
      delta = weights['temporal'] - base['temporal']
      m = f"base_temporal={base['temporal']:.4f}, boosted={weights['temporal']:.4f}, delta={delta:.4f}"
    assert_expr: "delta > 0.02"
    measurement_expr: "m"
    reason: High uncertainty must boost temporal weight

