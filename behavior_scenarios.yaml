# AISleepGen Behavior Audit Scenarios (Complete)
# 覆盖全部核心模块的行为验证

scenarios:
  # ==================== POMDP 核心 ====================

  - name: pomdp_text_changes_belief
    description: POMDP from text updates belief, score should drop
    imports:
      - "from pomdp_learner import get_engine"
    setup: |
      import pomdp_learner as _pm; _pm._engine = None; _pm.ALearner._shared_counts = None; _pm.ALearner._SHARED_DIR = None
      e = get_engine()
    action: |
      b0 = e.get_belief("_ba_pomdp_before").get("expected_score", 50)
      e.observe("_ba_pomdp", text="失眠了睡不着")
      b1 = e.get_belief("_ba_pomdp").get("expected_score", 0)
      m = b0 - b1
    assert_expr: "b1 < b0"
    measurement_expr: "m"
    reason: If POMDP doesn't update belief from text, it's dead code

  - name: shared_prior_affects_fresh_user
    description: Seed insomnia data should bias new user belief after first obs
    imports:
      - "from pomdp_learner import get_engine"
    setup: |
      import pomdp_learner as _pm; _pm._engine = None; _pm.ALearner._shared_counts = None; _pm.ALearner._SHARED_DIR = None
      e = get_engine()
      for uid in ["_ba_s1","_ba_s2","_ba_s3"]:
        e.observe(uid, text="失眠睡不着", score=25)
        e.observe(uid, text="彻夜失眠", score=20)
        e.observe(uid, text="一夜没睡好", score=30)
    action: |
      e.observe("_ba_fresh", text="失眠了")
      bel = e.get_belief("_ba_fresh")
      m = bel["expected_score"]
    assert_expr: "m < 49.0"
    measurement_expr: "m"
    reason: Shared prior should bias fresh user toward low scores

  - name: pomdp_drives_different_interventions
    description: Stress vs good-sleep users should get different intervention types
    imports:
      - "from pomdp_learner import get_engine"
      - "from sleep_coach import get_daily_suggestion"
    setup: |
      import copy, pomdp_learner as _pm; _pm._engine = None; _pm.ALearner._shared_counts = None; _pm.ALearner._SHARED_DIR = None
      e = get_engine()
      e.observe("_ba_stress", text="失眠了", score=25)
      e.observe("_ba_stress", text="焦虑", score=30)
      e.observe("_ba_good", text="睡得好", score=85)
      e.observe("_ba_good", text="精神好", score=88)
    action: |
      hits_s, hits_g = {}, {}
      p_s = {"openid":"_ba_stress","history":[{"total_score":25}],"sleep_coach":{},"latest_emotion":"焦虑"}
      p_g = {"openid":"_ba_good","history":[{"total_score":85}],"sleep_coach":{},"latest_emotion":"positive"}
      for _ in range(50):
        sg = get_daily_suggestion(copy.deepcopy(p_s), "焦虑")
        if sg: hits_s[sg["title"]] = hits_s.get(sg["title"],0)+1
        sg2 = get_daily_suggestion(copy.deepcopy(p_g), "positive")
        if sg2: hits_g[sg2["title"]] = hits_g.get(sg2["title"],0)+1
      top_s = max(hits_s, key=hits_s.get) if hits_s else "none"
      top_g = max(hits_g, key=hits_g.get) if hits_g else "none"
      m = "%s vs %s" % (top_s, top_g)
    assert_expr: "top_s != top_g"
    measurement_expr: "m"
    reason: Different POMDP beliefs should produce different intervention top-choices

  # ==================== 生命周期 + 异常检测 ====================

  - name: lifecycle_modulator_changes_decision
    description: Newbie push confidence lowered, dormant confidence boosted
    imports:
      - "from lifecycle_modulator import modulate_decision"
    setup: ""
    action: |
      p_new = {"history":[{"date":"2026-05-03"}],"sleep_coach":{}}
      p_dormant = {"history":[{"date":"2026-04-25"}],"first_date":"2026-03-01","last_active":"2026-04-25","sleep_coach":{}}
      dec = {"action":"push","confidence":0.8,"policy":"push"}
      m_new = modulate_decision("_ba_lc", p_new, dec)
      m_dormant = modulate_decision("_ba_lc", p_dormant, dec)
      nc = m_new["confidence"]
      dc = m_dormant["confidence"]
      m = "newbie=%.2f dormant=%.2f" % (nc, dc)
    assert_expr: "nc < 0.7 and dc > 0.85"
    measurement_expr: "m"
    reason: Lifecycle modulator must significantly change decision confidence

  - name: discrepancy_detector_triggers_on_spike
    description: Score drop 80->35 should trigger spike_down
    imports:
      - "from discrepancy_detector import detect"
    setup: ""
    action: |
      p = {"history":[{"total_score":80},{"total_score":82},{"total_score":79},{"total_score":78},{"total_score":81}]}
      r = detect("_ba_disc", 35, p)
      m = "z=%.2f %s" % (r["z_score"], r["direction"])
    assert_expr: 'r["has_discrepancy"] and r["direction"] == "spike_down"'
    measurement_expr: "m"
    reason: z=-28.5 must be detected as anomaly
    fuzz_inputs:
      - func: detect
        args: [null, 35, {}]
        label: "detect null openid"
      - func: detect
        args: ["_ba_fuzz", null, {}]
        label: "detect null score"
      - func: detect
        args: ["_ba_fuzz", 80, null]
        label: "detect null profile"
      - func: detect
        args: ["_ba_fuzz", 80, {"history": "bad"}]
        label: "detect history as string"

  - name: discrepancy_detector_stable_no_false
    description: Stable user normal fluctuation should not trigger
    imports:
      - "from discrepancy_detector import detect"
    setup: ""
    action: |
      p = {"history":[{"total_score":78},{"total_score":82},{"total_score":80},{"total_score":79},{"total_score":81}]}
      r = detect("_ba_stable", 79, p)
      m = "z=%.2f %s" % (r["z_score"], r["direction"])
    assert_expr: "not r[\"has_discrepancy\"]"
    measurement_expr: "m"
    reason: 1-point fluctuation 78->79 is normal range

  # ==================== LLM传感器 + 全链路 ====================

  - name: llm_as_sensor_feeds_pomdp
    description: LLM analysis results should feed into POMDP and change belief
    imports:
      - "from async_pipeline import _inject_llm_context_to_pomdp"
      - "from pomdp_learner import get_engine"
    setup: |
      import pomdp_learner as _pm; _pm._engine = None; _pm.ALearner._shared_counts = None; _pm.ALearner._SHARED_DIR = None
      e = get_engine()
    action: |
      before = e.get_belief("_ba_llmsensor").get("expected_score", 50)
      wm_result = {"total_score":22,"risk_flags":"焦虑、压力","confidence":0.6,"expert_debate":{}}
      _inject_llm_context_to_pomdp("_ba_llmsensor", "压力大", wm_result, {})
      after = e.get_belief("_ba_llmsensor").get("expected_score", 50)
      m = "%.1f->%.1f" % (before, after)
    assert_expr: "abs(before - after) > 0.5"
    measurement_expr: "m"
    reason: LLM output score=22 should lower POMDP belief

  - name: full_pipeline_no_crash
    description: Full chat+analyze pipeline should handle various inputs without crashing
    imports:
      - "from dp_router import dispatch"
    setup: ""
    action: |
      results = []
      for msg in ["睡不好","最近压力大","昨天3点才睡","睡得还行","怎么才能睡好"]:
        try:
          r = dispatch("POST", "/api/chat", {"openid":"_ba_full","message":msg,"history":[]})
          results.append(len(str(r)) > 50)
        except: results.append(False)
      all_ok = all(results)
      m = "%s/5 passed" % sum(results)
    assert_expr: "all_ok"
    measurement_expr: "m"
    reason: Any input causing crash is P0 bug

  # ==================== 卡尔曼滤波 ====================

  - name: kalman_filter_suppresses_outliers
    description: Kalman filter input=15 outlier should produce smooth estimate ~80 not ~15
    imports:
      - "from kalman_filter import get_manager"
    setup: |
      km = get_manager()
      kf = km.get_filter("_ba_probe_kf")
    action: |
      kf.x[0] = 75.0
      for v in [80, 82, 15, 81, 79]:
        kf.predict()
        kf.update(v)
      est = kf.x[0]
      m = "est=%.1f" % est
    assert_expr: "est > 50"
    measurement_expr: "m"
    reason: Kalman filter should suppress outlier 15 and follow ~80 trend

  # ==================== 昼夜节律 ====================

  - name: circadian_phase_detects_drift
    description: 4 consecutive delaying bedtimes should produce positive drift_rate
    imports:
      - "from circadian_phase_model import _fit_cosine_model"
    setup: ""
    action: |
      cp = _fit_cosine_model([23.5, 24.5, 25.0, 26.0])
      drift = cp.drift_rate if cp else 0
      m = "drift=%.2f min/day" % drift
    assert_expr: "drift > 0"
    measurement_expr: "m"
    reason: Bedtimes 23:30→00:30→01:00→02:00 should show positive drift

  - name: circadian_profile_fit_from_user_history
    description: fit_circadian_profile from real user history
    imports:
      - "from circadian_phase_model import fit_circadian_profile"
    setup: ""
    action: |
      p = {"history":[
        {"date":"2026-05-01","bedtime":"23:30","total_score":72},
        {"date":"2026-05-02","bedtime":"00:15","total_score":65},
        {"date":"2026-05-03","bedtime":"01:00","total_score":58},
        {"date":"2026-05-04","bedtime":"02:00","total_score":50},
      ]}
      cp = fit_circadian_profile(p)
      if cp:
        m = "phase=%.1f, drift=%.2f" % (cp.acrophase, cp.drift_rate)
        ok = cp.sample_count >= 4
      else:
        m = "None"
        ok = False
      assert_val = ok
    assert_expr: "assert_val"
    measurement_expr: "m"
    reason: fit_circadian_profile must fit from 4 real bedtime entries

  # ==================== 预测编码 ====================

  - name: predictive_coding_predicts_next_score
    description: PredictTonight should return a score estimate near user baseline
    imports:
      - "from predictive_coding import get_predictor_for_user"
    setup: |
      pc = get_predictor_for_user("_ba_probe_pc")
    action: |
      prof = {"openid":"_ba_probe_pc","history":[{"total_score":78,"bedtime":"23:00"},{"total_score":82,"bedtime":"23:30"},{"total_score":80,"bedtime":"22:45"}]}
      pc.update_from_survey(prof, score=80)
      pred = pc.predict_tonight(openid="_ba_probe_pc")
      pv = pred.get("score", pred.get("predicted_score", 0))
      m = "pred=%.1f, keys=%s" % (pv, list(pred.keys())[:4])
    assert_expr: "pv > 30"
    measurement_expr: "m"
    reason: Predictive coding should return a positive number from predict_tonight

  # ==================== 元学习 ====================

  - name: meta_learner_records_and_tracks_params
    description: ParamHistory.snapshot should record parameter changes
    imports:
      - "from meta_learner import ParamHistory"
    setup: |
      import tempfile, os
      ph = ParamHistory(path=os.path.join(tempfile.gettempdir(), "_ba_ph_test.json"))
    action: |
      ph.snapshot("_ba_probe_ml", "beta=0.5 initial")
      ph.snapshot("_ba_probe_ml", "beta=0.8 adjust")
      summ = ph.get_history_summary()
      m = "summary=%s" % str(summ)[:100]
    assert_expr: "len(str(summ)) > 20"
    measurement_expr: "m"
    reason: 2 snapshots should produce non-empty history summary

  # ==================== 意识决策器 ====================

  - name: conscious_decider_makes_rational_decision
    description: High-urgency chat event should trigger a valid action
    imports:
      - "from conscious_decider import ConsciousDecider"
    setup: ""
    action: |
      cd = ConsciousDecider()
      dec = cd.decide("_ba_probe_cd", "chat", {"message":"失眠了","session_count":3,"time_since_last":3600,"urgency":"high","mode":"push"}, profile={"testing":True})
      act = dec.get("action", dec.get("decision", "none"))
      m = "action=%s" % act
    assert_expr: 'act in ["push", "in_chat", "probe", "delay_push","skip","none","push_now"]'
    measurement_expr: "m"
    reason: Conscious decider should always return a valid action

  # ==================== 稳态双回路 ====================

  - name: homeostatic_circuit_evaluates_state
    description: Circuit context for low-score user returns non-empty structure
    imports:
      - "from homeostatic_circuit import get_circuit_context, start_circuit"
    setup: |
      start_circuit()  # ensure signal board exists
    action: |
      ctx = get_circuit_context("_ba_probe_hc")
      if isinstance(ctx, dict):
        keys = list(ctx.keys())
        m = "keys=%s" % keys[:5]
      else:
        keys = []
        m = "type=%s" % type(ctx).__name__
    assert_expr: "len(keys) > 0"
    measurement_expr: "m"
    reason: Circuit context should return structured data

  # ==================== 具身上下文 ====================

  - name: body_context_remembers_recent_events
    description: Reporting events via body_context should return structured data
    imports:
      - "from body_context import get_body_context, report_body_event, render_body_context_text"
    setup: ""
    action: |
      report_body_event("_ba_probe_bc", "失眠", {"mood":"焦虑","physical":"头痛"})
      report_body_event("_ba_probe_bc", "睡不好", {"mood":"烦躁"})
      ctx = get_body_context("_ba_probe_bc")
      keys = list(ctx.keys())
      m = "keys=%s, has_events=%s" % (keys[:5], "生理" in str(ctx.get("physiological",{})))
    assert_expr: "len(keys) > 3"
    measurement_expr: "m"
    reason: Body context should return structured non-empty dict

  # ==================== 实验日志 ====================

  - name: experiment_log_tracks_decisions
    description: Logging a designed experiment should make it queryable by openid
    imports:
      - "from experiment_log import get_log, Experiment"
    setup: |
      import time
      el = get_log()
    action: |
      exp = Experiment(
        openid="_ba_probe_el",
        intervention_type="push",
        hypothesis="test behavior audit",
        intervention_data={"action":"push","confidence":0.7}
      )
      exp.experiment_id = "_ba_el_" + str(int(time.time()))
      eid = el.record_designed(exp)
      recent = el.query(openid="_ba_probe_el")
      m = "found=%d" % len(recent)
    assert_expr: "len(recent) >= 1"
    measurement_expr: "m"
    reason: Experiment log should persist and retrieve decisions

  # ==================== 预测引擎 ====================

  - name: prediction_engine_produces_tomorrow_estimate
    description: predict_tonight should return a dict with pred info
    imports:
      - "from prediction_engine import predict_tonight"
    setup: ""
    action: |
      prof = {"openid":"_ba_probe_pe","history":[{"total_score":75} for _ in range(7)]}
      res = predict_tonight(prof, "_ba_probe_pe")
      if isinstance(res, dict):
        val = res.get("predicted_score", res.get("score", res.get("prediction", 0)))
        m = "predicted=%.1f, keys=%s" % (val, list(res.keys())[:4])
      else:
        val = 0
        m = "type=%s,repr=%s" % (type(res).__name__, repr(res)[:60])
    assert_expr: "val > 0 if isinstance(res, dict) else len(str(res)) > 0"
    measurement_expr: "m"
    reason: Prediction engine must return a usable result

  # ==================== 内感受预测（仿真引擎） ====================

  - name: interoceptive_prediction_simulates_then_selects
    description: simulate_suggestion_effect should produce structured result, select_suggestion_with_simulation should pick top
    imports:
      - "from interoceptive_prediction import simulate_suggestion_effect, simulate_push_effect, simulate_companion_duration, select_suggestion_with_simulation"
    setup: ""
    action: |
      p = {"openid":"_ba_probe_ip","history":[{"total_score":45,"bedtime":"01:00"}],"sleep_coach":{}}
      sim = simulate_suggestion_effect(p, "relax")
      push = simulate_push_effect(p)
      dur = simulate_companion_duration(p)
      candidates = [("relax",{"title":"放松"},75),("habit",{"title":"提前上床"},50),("breath",{"title":"4-7-8呼吸"},60)]
      sel = select_suggestion_with_simulation(p, candidates)
      m = "sim_effect=%+d, push=%s, dur=%dmin, top=%s" % (
        sim.get("predicted_effect",0), push.get("should_push","?"),
        dur.get("predicted_minutes",0), sel[0] if sel else "none")
    assert_expr: "sim.get('predicted_effect',0) != 0 and sel is not None"
    measurement_expr: "m"
    reason: Interoceptive prediction should simulate effects and return a top candidate
    fuzz_inputs:
      # select_suggestion_with_simulation — 已有真实bug：传入dict列表会crash
      - func: select_suggestion_with_simulation
        args:
          - {"openid":"_ba_fuzz_ip","history":[],"sleep_coach":{}}
          - [{"key":"relax","title":"放松","score":75},{"key":"habit","title":"提前上床","score":50}]
        label: "select_suggestion_with_simulation bad format (dict list)"
      - func: select_suggestion_with_simulation
        args:
          - {"openid":"_ba_fuzz_ip","history":[],"sleep_coach":{}}
          - - relax
            - {"title":"放松"}
        label: "select_suggestion_with_simulation missing score element"
      - func: select_suggestion_with_simulation
        args:
          - {"openid":"_ba_fuzz_ip","history":[],"sleep_coach":{}}
          - "relax"
        label: "select_suggestion_with_simulation single string"
      - func: select_suggestion_with_simulation
        args:
          - {"openid":"_ba_fuzz_ip","history":[],"sleep_coach":{}}
          - null
        label: "select_suggestion_with_simulation None"
      - func: simulate_suggestion_effect
        args: [{}, null]
        label: "simulate_suggestion_effect empty profile, None key"
      - func: simulate_suggestion_effect
        args: [null, "relax"]
        label: "simulate_suggestion_effect null profile"
      - func: simulate_push_effect
        args: [null]
        label: "simulate_push_effect null profile"
      - func: simulate_companion_duration
        args: [null]
        label: "simulate_companion_duration null profile"

  # ==================== dp_router深层分支（多API端点） ====================

  - name: dp_router_handles_deep_branches
    description: Sleep-analyze with history, update-profile, feedback should all work
    imports:
      - "from dp_router import dispatch"
    setup: ""
    action: |
      import json
      checks = []
      # analyze with full history
      r1 = dispatch("POST", "/api/sleep-analyze", {
        "openid":"_ba_deep","message":"最近睡得不好",
        "history":[{"total_score":45,"date":"2026-05-03"},{"total_score":38,"date":"2026-05-04"}],
        "chat_history":[{"role":"user","content":"最近压力大"}]
      })
      checks.append(len(str(r1)) > 50)
      # update-profile
      r2 = dispatch("POST", "/api/update-profile", {
        "openid":"_ba_deep","profile":{"snooze_habit":True,"alarm_time":"07:00"}
      })
      checks.append(bool(r2))
      # feedback
      r3 = dispatch("POST", "/api/feedback", {
        "openid":"_ba_deep","feedback":"这个建议很有用","suggestion_title":"放松练习"
      })
      checks.append(bool(r3))
      # empty history chat (edge case)
      r4 = dispatch("POST", "/api/chat", {
        "openid":"_ba_edge","message":"你好","history":[]
      })
      checks.append(len(str(r4)) > 50)
      all_ok = all(checks)
      m = "%s/4" % sum(checks)
    assert_expr: "all_ok"
    measurement_expr: "m"
    reason: Deep dp_router branches must handle all API endpoints

  # ==================== 调度器清理模块 ====================

  - name: scheduler_cleanup_removes_expired
    description: _cleanup_expired should remove expired push entries
    imports:
      - "from scheduler_daemon import _cleanup_expired"
    setup: |
      import time, json, os
      from scheduler_daemon import _load_push_queue, _save_push_queue

      data_dir = os.path.join("D:", "AISleepGen_Optimized", "data")
      os.makedirs(data_dir, exist_ok=True)
    action: |
      _save_push_queue([
        {"id":"_ba_expired","expires_at":0,"content":"old"},
        {"id":"_ba_valid","expires_at":time.time()+3600,"content":"fresh"},
      ])
      _cleanup_expired()
      q = _load_push_queue()
      remaining = [e.get("id") for e in q]
      m = "size=%d, ids=%s" % (len(q), remaining)
    assert_expr: '"Expired push" in str(remaining) or ("_ba_valid" in remaining and len(q) == 1)'
    measurement_expr: "m"
    reason: Scheduler cleanup should remove expired entries

  # ==================== Online RL 模块 ====================

  - name: rl_empty_user_explores
    description: Empty user with no history should use epsilon=0.4 and return random actions
    imports:
      - "from online_rl import OnlineRL, StateEncoder, ACTIONS"
    setup: |
      import random; random.seed(42)
      rl = OnlineRL()
    action: |
      ctx = {}
      action = rl.act("_ba_rl_empty", ctx)
      eps = rl._get_effective_epsilon("_ba_rl_empty", ctx)
      m = "action=%s, eps=%.2f" % (action, eps)
    assert_expr: "m and eps >= 0.3"
    measurement_expr: "m"
    reason: Empty users should have high epsilon for exploration

  - name: rl_greedy_on_known_user
    description: User with high Q values for ask should return ask as best action
    imports:
      - "from online_rl import OnlineRL, StateEncoder, ACTIONS"
    setup: |
      rl = OnlineRL(epsilon=0.0)
      rl._ensure_q("_ba_rl_greedy")
      for s in range(144):
        for i, a in enumerate(ACTIONS):
          rl._q_tables["_ba_rl_greedy"]["Q1"]["%d_%d" % (s, i)] = 1.5 if a == "ask" else 0.5
          rl._q_tables["_ba_rl_greedy"]["Q2"]["%d_%d" % (s, i)] = 1.5 if a == "ask" else 0.5
      rl._update_counters["_ba_rl_greedy"] = 100
    action: |
      results = {}
      for _ in range(50):
        a = rl.act("_ba_rl_greedy", {"score": 75, "pomdp_entropy": 0.2, "n_observations": 20})
        results[a] = results.get(a, 0) + 1
      best_a = max(results, key=results.get)
      m = "best=%s, results=%s" % (best_a, results)
    assert_expr: "best_a == 'ask'"
    measurement_expr: "m"
    reason: With epsilon=0, greedy should always pick highest Q

  - name: rl_positive_feedback_raises_q
    description: Positive reward should increase Q value
    imports:
      - "from online_rl import OnlineRL, StateEncoder, ACTIONS"
    setup: |
      rl = OnlineRL(alpha=0.1, epsilon=0.0)
      rl._ensure_q("_ba_rl_pos")
    action: |
      q_before = rl._q("_ba_rl_pos", StateEncoder.encode(2, 1, 1, 3), 0, "Q1")
      rl.update("_ba_rl_pos", "ask", 1.0, {"score": 75, "pomdp_entropy": 0.4, "trend": "flat", "last_effect": "none"})
      q_after = rl._q("_ba_rl_pos", StateEncoder.encode(2, 1, 1, 3), 0, "Q1")
      m = "%.4f -> %.4f" % (q_before, q_after)
    assert_expr: "q_after > q_before"
    measurement_expr: "m"
    reason: Q-learning must increase Q for positive rewards

  - name: rl_negative_feedback_lowers_q
    description: Negative reward should decrease Q value
    imports:
      - "from online_rl import OnlineRL, StateEncoder, ACTIONS"
    setup: |
      rl = OnlineRL(alpha=0.1, epsilon=0.0)
      rl._ensure_q("_ba_rl_neg")
    action: |
      q_before = rl._q("_ba_rl_neg", StateEncoder.encode(1, 1, 1, 3), 1, "Q1")
