  - name: rl_full_decision_cycle
    description: Complete RL loop should accumulate history
    imports:
      - "from online_rl import OnlineRL"
    setup: |
      rl = OnlineRL(epsilon=0.3)
    action: |
      openid = "_ba_rl_cycle_" + str(hash(str(rl._update_counters)))
      for step in range(10):
        ctx = {"score": 60 + (step%5)*5, "trend": "flat", "pomdp_entropy": 0.5, "last_effect": "none", "n_observations": 3+step}
        act = rl.act(openid, ctx)
        reward = 0.5 if act in ("ask", "probe") else -0.2 if act == "push" else 0.0
        rl.update(openid, act, reward, {"score": ctx["score"]+5, "pomdp_entropy": max(0.1, ctx["pomdp_entropy"]-0.1), "last_effect": "effective", "n_observations": ctx["n_observations"]+1})
      s = rl.get_policy_summary(openid)
      m = "updates=%d, eps=%.4f" % (s["total_updates"], s["epsilon"])
    assert_expr: "s['total_updates'] == 10"
    measurement_expr: "m"
    reason: Full RL cycle must accumulate and track history

