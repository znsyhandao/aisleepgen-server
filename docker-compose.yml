version: '3'
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - WECHAT_API_KEY=${WECHAT_API_KEY}
      - ALIPAY_APP_ID=${ALIPAY_APP_ID}
    depends_on:
      - redis
      - db
      - prometheus  # 新增依赖
      - loki  # 添加对loki的依赖

  # 新增监控服务
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus  # 新增持久化存储
      - ./monitoring/rules:/etc/prometheus/rules  # 告警规则
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          memory: 1G
volumes:
  prometheus_data:  # 新增Prometheus持久化卷


  # 新增日志收集服务
  loki:
    image: grafana/loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/var/lib/loki  # 添加持久化卷
      - ./monitoring/rules:/etc/loki/rules  # 告警规则
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          memory: 512M
    
    # 新增告警管理器
  alertmanager:
    image: prom/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M


  postgres_data:
  grafana_data:
  loki_data:  # 新增loki持久化卷

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - postgres_data:/var/lib/postgresql/data


# ... 保留其他服务配置 ...

app:
  build: .
  ports:
    - "8000:8000"
  environment:
    - WECHAT_API_KEY=${WECHAT_API_KEY}
    - ALIPAY_APP_ID=${ALIPAY_APP_ID}
  depends_on:
    redis:
      condition: service_healthy
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s
    timeout: 10s
    retries: 3
  deploy:
    resources:
      limits:
        cpus: '2'
        memory: 4G
      reservations:
        memory: 2G

redis:
  image: redis:alpine
  ports:
    - "6379:6379"
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 30s
    timeout: 5s
    retries: 3
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 1G

db:
  image: postgres:13
  environment:
    POSTGRES_PASSWORD: example
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 30s
    timeout: 5s
    retries: 3
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 2G

# ... 保留其他服务配置 ...

  app:
    # ... 保留原有配置 ...
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: "loki"
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"

  prometheus:
    # ... 保留原有配置 ...
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--enable-feature=remote-write-receiver'
    environment:
      - ENABLE_AUTO_SCALING=true

  alertmanager:
    # ... 保留原有配置 ...
    environment:
      - AUTO_SCALE_THRESHOLD=0.8
      - SLACK_WEBHOOK=${SLACK_WEBHOOK}

# 新增自动扩容服务
  autoscaler:
    image: ghcr.io/autoscale/payment-autoscaler
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - SCALE_UP_THRESHOLD=0.75
      - SCALE_DOWN_THRESHOLD=0.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - prometheus
